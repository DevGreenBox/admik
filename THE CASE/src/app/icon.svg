<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Фавикон THE CASE. Знак взят из брендбука (стр. «ЛОГО»): одиночная «C»
       фирменных пропорций + красная акцентная черта под ней.
       Цвета — официальная палитра брендбука: графит #2B2B2B, акцент #B11226.

       Буква нарисована ДУГОЙ, а не текстом: Century Gothic есть не во всех
       системах, а иконка должна выглядеть одинаково везде. Century Gothic —
       геометрический гротеск, поэтому «C» = окружность с ровным штрихом и
       горизонтальными срезами концов (терминалами).

       ГЕОМЕТРИЯ ПОД МЕЛКИЙ РАЗМЕР (проверено рендером 16×16):
       вся композиция (буква + черта) центрируется по вертикали как единое
       целое, иначе знак «висит» в верхней половине квадрата. Черта сделана
       толще и шире логотипной пропорции: на 16px тонкая полоса вырождается
       в бледное пятно (субпиксельное сглаживание съедает цвет). -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- Буква: центр (256, 232), радиус 142, штрих 38. Разрыв справа даёт
       раствор ~86°, как у Century Gothic. Концы дуги симметричны оси y=232.
       stroke-linecap="butt" — прямые срезы терминалов. -->
  <path d="M 362.6 163.4 A 142 142 0 1 0 362.6 300.6"
        fill="none" stroke="#2B2B2B" stroke-width="38" stroke-linecap="butt"/>

  <!-- Акцентная черта: ширина 132 (≈½ ширины буквы), высота 30 — читается
       даже на 16px. Отступ от нижней кромки буквы (y=374) — 46px. -->
  <rect x="190" y="420" width="132" height="30" fill="#B11226"/>
</svg>
