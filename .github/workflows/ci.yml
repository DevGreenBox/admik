# =============================================================================
# Admik — CI: проверка качества на каждый push и pull request
# =============================================================================
# Пайплайн: установка зависимостей -> typecheck -> lint -> test -> build.
# Используется pnpm с кешированием store для ускорения.
# =============================================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Отменяем устаревшие запуски на той же ветке/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm должен быть установлен до setup-node, чтобы сработал кеш pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        # frozen-lockfile если лок есть; иначе обычная установка (fallback)
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "pnpm-lock.yaml не найден — установка без frozen-lockfile"
            pnpm install
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # ---------------------------------------------------------------------------
  # Линт shell-скриптов (Этап 6): shellcheck + bash -n по каждому скрипту.
  # Независим от основного job, гоняется параллельно.
  # ---------------------------------------------------------------------------
  scripts-lint:
    name: Scripts · shellcheck · bash -n
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: bash -n (синтаксис каждого скрипта)
        run: |
          for f in scripts/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done
